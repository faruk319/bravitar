# Every push and PR: types, lint, unit + integration tests, the tenant-leak
# suite and a production build, against a local Supabase stack like dev.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - run: supabase start
      - run: pnpm migrate
      - run: pnpm test:integration
      - run: pnpm test:isolation
      - run: pnpm seed
      - run: pnpm build
